<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealGuard — On-chain Dispute Arbitration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0e1a; --card: #151a2e; --line: #262d4a;
      --acc: #7c5cff; --ok: #2ecc71; --warn: #f1c40f; --err: #e74c3c;
      --txt: #e8eaf6; --mut: #9aa3c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 80% -10%, #241a4d 0%, var(--bg) 55%);
      color: var(--txt); min-height: 100vh; padding: 32px 16px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 26px; }
    h1 span { color: var(--acc); }
    .badge { background: var(--acc); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
    button {
      font-family: inherit; cursor: pointer; border: 1px solid var(--line);
      background: var(--card); color: var(--txt); padding: 10px 18px; border-radius: 10px;
      font-size: 14px; transition: .15s;
    }
    button:hover { border-color: var(--acc); }
    button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
    .card h2 { font-size: 16px; margin-bottom: 14px; color: var(--mut); font-weight: 500; letter-spacing: .4px; }
    label { display: block; font-size: 12px; color: var(--mut); margin: 12px 0 6px; }
    input, textarea, select {
      width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--txt);
      border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: 14px;
    }
    textarea { min-height: 70px; resize: vertical; }
    .row { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .msg { margin-top: 14px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
    .msg.show { display: block; }
    .msg.ok { background: rgba(46,204,113,.12); color: var(--ok); border: 1px solid rgba(46,204,113,.35); }
    .msg.err { background: rgba(231,76,60,.12); color: var(--err); border: 1px solid rgba(231,76,60,.35); }
    .msg.info { background: rgba(124,92,255,.12); color: var(--acc); border: 1px solid rgba(124,92,255,.35); }
    pre.state { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 13px; overflow: auto; white-space: pre-wrap; min-height: 90px; }
    .stat { display: inline-flex; gap: 8px; align-items: center; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mut); display: inline-block; }
    .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--mut); border: 1px solid var(--line); margin-right: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Deal<span>Guard</span></h1>
      <div style="display:flex;gap:10px;align-items:center;">
        <span class="stat"><span class="dot" id="netDot"></span><span id="netLabel">not connected</span></span>
        <button id="connectBtn" class="primary">Connect wallet</button>
      </div>
    </header>

    <div class="grid">
      <!-- Create dispute -->
      <div class="card">
        <h2>OPEN A DISPUTE</h2>
        <label>Seller address</label>
        <input id="seller" placeholder="0x…" />
        <label>Escrowed amount (GEN)</label>
        <input id="amount" type="number" min="0" step="1" placeholder="100" />
        <label>Dispute description</label>
        <textarea id="desc" placeholder="e.g. Agent B was supposed to deliver a dataset but the file is corrupt."></textarea>
        <div class="row">
          <button class="primary" id="createBtn">Create dispute</button>
          <span class="tag">newest id: <b id="newestId">–</b></span>
        </div>
        <div class="msg" id="createMsg"></div>
      </div>

      <!-- Evidence -->
      <div class="card">
        <h2>SUBMIT EVIDENCE</h2>
        <label>Dispute ID</label>
        <input id="evId" type="number" min="1" placeholder="1" />
        <label>Evidence URL</label>
        <input id="evUrl" placeholder="https://…" />
        <label>What does this prove?</label>
        <textarea id="evDesc" placeholder="e.g. Payment receipt showing the transfer"></textarea>
        <div class="row">
          <button class="primary" id="evBtn">Submit evidence</button>
        </div>
        <div class="msg" id="evMsg"></div>
      </div>
    </div>

    <!-- Ruling -->
    <div class="card" style="margin-top:18px;">
      <h2>REQUEST AI RULING</h2>
      <div class="row" style="margin-top:0;">
        <input id="ruleId" type="number" min="1" placeholder="Dispute ID" style="max-width:180px;" />
        <button class="primary" id="ruleBtn">Ask the LLM jury</button>
        <button id="settleBtn">Settle (release escrow)</button>
        <button id="refreshBtn">↻ Refresh</button>
      </div>
      <div class="msg" id="ruleMsg"></div>
      <div style="margin-top:14px;">
        <label>Dispute state</label>
        <pre class="state" id="stateBox">Connect your wallet and create or load a dispute…</pre>
      </div>
    </div>

    <p style="color:var(--mut);font-size:12px;margin-top:22px;text-align:center;">
      DealGuard · on-chain adjudication for agentic commerce · Intelligent Contract on GenLayer (Bradbury testnet)
    </p>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
